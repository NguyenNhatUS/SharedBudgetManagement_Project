spring.application.name=SharedBudgetManagement


# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/SharedBudgetManagement
spring.datasource.username=root
spring.datasource.password=ducnhat12a1


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=10
spring.jpa.properties.hibernate.generate_statistics=true


# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Server
server.port=8080


# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000


# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# OAuth2 Frontend Redirect URI (frontend sẽ nhận token tại URL này)
app.oauth2.authorized-redirect-uri=http://localhost:3000/oauth2/callback


# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Spring Cache Configuration (Redis Cache-Aside)
spring.cache.type=redis
spring.cache.redis.time-to-live=600000ms
spring.cache.redis.cache-null-values=true
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=sbm:cache:


# Spring Mail Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App Mail Custom Properties
app.mail.from=${APP_MAIL_FROM:noreply@sharedbudget.com}
app.mail.invitation-url=${APP_MAIL_INVITATION_URL:http://localhost:3000/invitations}